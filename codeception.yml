# global codeception file to run tests from all apps
include:
    - common
    - frontend
    - backend
paths:
    output: console/runtime/output
settings:
    colors: true
    suites:
        frontend:
            path: /frontend/tests
            actor: FrontendTester
            modules:
                enabled:
                    - Yii2:
                          configFile: /frontend/config/test.php
                    - Asserts
